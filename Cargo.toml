[package]
name = "ipscan"
version = "0.1.0"
edition = "2021"
description = "Finds devices with a static IP outside the expected range using raw ARP, NDP and DHCP sniffing"

[dependencies]
pnet = "0.35"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ipnet = "2"
libc = "0.2"
ratatui = "0.30"
crossterm = "0.29"

[profile.release]
opt-level = 3
lto = true
